spring.application.name=grocery-store

# ── DataSource ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:grocery_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP ───────────────────────────────────────────────────────────────
spring.datasource.hikari.pool-name=GroceryStorePool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '15s'

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── Security / JWT ─────────────────────────────────────────────────────────
app.security.jwt.secret=${JWT_SECRET}
# Store users (OWNER/CASHIER): short-lived access token, renewed via the refresh cookie.
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# SUPER_ADMIN: no refresh token, keeps its long-lived access token.
app.security.jwt.admin-expiration-minutes=${JWT_ADMIN_EXPIRATION_MINUTES:480}
app.security.jwt.issuer=grocery-store
app.security.agent.api-key=${AGENT_API_KEY:default-agent-secret}

# ── Refresh tokens (store users only; httpOnly cookie, Path=/api/v1/auth) ──
app.security.refresh.days=${REFRESH_TOKEN_DAYS:60}
# Dev-only escape hatch: browsers drop Secure cookies set over plain http (except localhost).
app.security.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}
# Window in which a just-rotated token may rotate again (multi-tab / mobile retry race).
app.security.refresh.reuse-grace-seconds=30
app.security.refresh.cleanup-retention-days=30

# ── Reverse proxy (Caddy) ─────────────────────────────────────────────────
# Trust X-Forwarded-For/Proto from internal proxies only (Tomcat RemoteIpValve defaults:
# 10/8, 172.16/12, 192.168/16, 127/8, ...) so getRemoteAddr() is the real client IP.
server.forward-headers-strategy=native

# ── CORS ───────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5174,http://192.168.68.69:5173}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

# ── Storage / Cloudflare R2 (product images) ───────────────────────────────
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket-name=${R2_BUCKET_NAME:ventacore-products}
app.storage.r2.public-url=${R2_PUBLIC_URL:}

# ── Multipart (image uploads; business limit 2MB enforced in ProductService) ─
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# ── Evolution API (WhatsApp) ───────────────────────────────────────────────
evolution.api.base-url=${EVOLUTION_BASE_URL:http://localhost:8081}
evolution.api.apikey=${EVOLUTION_APIKEY:change_me}
evolution.api.instance=${EVOLUTION_INSTANCE:pos-instance}

# ── Telegram (admin alerts) ──────────────────────────────────────────────────
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
