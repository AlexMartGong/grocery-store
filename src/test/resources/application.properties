# Test-only config. Overrides main application.properties entirely.
spring.application.name=grocery-store

# DataSource (tests mock the DB or exclude autoconfig; values just need to bind)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:grocery_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT — test-only secret, never use elsewhere
app.security.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1iYXNlNjQtMzItYnl0ZXMtbG9uZy1mb3ItaHMyNTYtYWxnb3JpdGhtLXh4
app.security.jwt.expiration-minutes=480
app.security.jwt.issuer=grocery-store
app.security.agent.api-key=test-agent-key

# Notification gateways. EvolutionWhatsAppClient injects evolution.api.* via @Value with
# NO default, so omitting them fails context startup outright (PlaceholderResolutionException),
# not just at send time — @SpringBootTest could never boot without these. The host is an
# RFC 2606 .invalid domain: it can never resolve, so a stray send fails fast instead of
# reaching a real gateway. telegram.bot.token has a ":" default and is empty here (send = no-op).
evolution.api.base-url=http://evolution.invalid
evolution.api.apikey=test-apikey
evolution.api.instance=test-instance
telegram.bot.token=

# Storage / Cloudflare R2 (empty creds — storage is mocked in tests)
app.storage.r2.account-id=
app.storage.r2.access-key-id=
app.storage.r2.secret-access-key=
app.storage.r2.bucket-name=ventacore-products
app.storage.r2.public-url=

# Multipart (mirror main; business limit 2MB enforced in ProductService)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# CORS
app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
app.cors.max-age=3600
