name: Deploy to Netcup VPS

# Run only on push to master
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # VPS pulls the repo and builds the multi-stage image itself;
      # the runner only triggers the remote deploy over SSH.
      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/grocery-store
            git checkout master
            git pull origin master
            docker compose up -d --build
            # Drop dangling layers left by the multi-stage build
            docker image prune -f
