name: Deploy to Netcup VPS

# Run only on push to master
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      # Build the runnable JAR on the runner — the VPS never compiles
      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      # Ship build artifacts; strip_components: 0 keeps relative paths, so the
      # jar lands at /opt/grocery-store/target/*.jar (matches Dockerfile COPY)
      # and script.sql keeps the path the compose volume mount expects
      - name: Copy artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/*.jar,Dockerfile,docker-compose.yml,.dockerignore,src/main/resources/script.sql"
          target: /opt/grocery-store
          strip_components: 0
          overwrite: true

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/grocery-store
            docker compose up -d --build
            # Drop dangling layers left by the image rebuild
            docker image prune -f
